<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clic Challenge 🎯</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>🎯 Clic Challenge</h1>
      <p class="subtitle">Test your reflexes!</p>

      <section id="settings">
        <h2>⚙️ Game Settings</h2>

        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>

        <label for="speed">Target Speed</label>
        <select id="speed">
          <option value="slow">Slow</option>
          <option value="normal" selected>Normal</option>
          <option value="fast">Fast</option>
        </select>

        <label for="duration">Game Duration</label>
        <select id="duration">
          <option value="30">30 seconds</option>
          <option value="60">60 seconds</option>
          <option value="90">90 seconds</option>
        </select>

        <button id="start">🚀 Start Game</button>
      </section>

      <section id="gameSection" hidden>
        <div class="stats">
          <div>🏆 Score <strong id="score">0</strong></div>
          <div>⏱️ Time <strong id="timer">30</strong>s</div>
          <div>🎯 Level <strong id="level">Medium</strong></div>
        </div>

        <div id="game">
          <button id="target" aria-label="Click the target">🎯</button>
        </div>

        <h2 id="message">Click the target!</h2>
        <button id="back">⚙️ Change Settings</button>
        <button id="restart" hidden>🔄 Play Again</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
